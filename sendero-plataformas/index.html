<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendero — Plataformas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <h1>Sendero <span>::</span> Plataformas</h1>
    <div class="hint">← → mover · espacio / ↑ saltar</div>
  </div>

  <div class="stage">
    <canvas id="game" width="800" height="450"></canvas>
    
    <div class="hud">
      <div class="gems">◆ Gemas: <span id="hudGems">0</span>/<span id="hudGemsTotal">0</span></div>
      <div class="level">Nivel <span id="hudLevel">1</span>/<span id="hudLevelTotal">3</span></div>
      <div class="lives">Vidas: <span id="hudLives">3</span></div>
      <button id="btnBackToMenu" class="hud-btn">⏸ Menú</button>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div class="overlay" id="overlayMainMenu">
      <h2 class="game-title">Sendero</h2>
      <p>Guía a tu entidad geométrica a través del abismo de neón.</p>
      <div class="menu-actions">
        <button class="action" id="btnStart">Jugar</button>
        <button class="action btn-secondary" id="btnShowLevels">Niveles</button>
        <button class="action btn-secondary" id="btnShowConfig">⚙️ Configuración</button>
      </div>
    </div>

    <!-- NUEVO: MENÚ DE CONFIGURACIÓN -->
    <div class="overlay hidden" id="overlayConfig">
      <h2>Personalizar</h2>
      
      <div class="config-section">
        <h3>Forma del Personaje</h3>
        <div class="options-row" id="shapeOptions">
          <button class="config-btn active" data-shape="rombo">Rombo</button>
          <button class="config-btn" data-shape="cuadrado">Cuadrado</button>
          <button class="config-btn" data-shape="circulo">Círculo</button>
        </div>
      </div>

      <div class="config-section">
        <h3>Color de Neón</h3>
        <div class="options-row" id="colorOptions">
          <button class="color-btn active" data-color="#ff2a6d" style="background:#ff2a6d"></button>
          <button class="color-btn" data-color="#05d9e8" style="background:#05d9e8"></button>
          <button class="color-btn" data-color="#b624ff" style="background:#b624ff"></button>
          <button class="color-btn" data-color="#39ff14" style="background:#39ff14"></button>
          <button class="color-btn" data-color="#ffaa00" style="background:#ffaa00"></button>
        </div>
      </div>

      <button class="action btn-secondary" id="btnBackFromConfig" style="margin-top:20px;">Guardar y Volver</button>
    </div>

    <!-- SELECTOR DE NIVELES -->
    <div class="overlay hidden" id="overlayLevelSelect">
      <h2>Niveles</h2>
      <div class="level-grid" id="levelGrid"></div>
      <button class="action btn-secondary" id="btnBackFromLevels">Volver</button>
    </div>

    <!-- PANTALLAS DE RESULTADOS -->
    <div class="overlay hidden" id="overlayLevelClear">
      <h2>¡Nivel superado!</h2>
      <p id="levelClearText"></p>
      <button class="action" id="btnNextLevel">Siguiente nivel</button>
    </div>

    <div class="overlay hidden" id="overlayWin">
      <h2>¡Sendero completado!</h2>
      <p id="winText"></p>
      <button class="action" id="btnRestartWin">Volver al Menú</button>
    </div>

    <div class="overlay hidden" id="overlayGameOver">
      <h2>Sin vidas</h2>
      <p id="gameOverText"></p>
      <div class="menu-actions">
        <button class="action" id="btnRestart">Reintentar Nivel</button>
        <button class="action btn-secondary" id="btnQuitGameOver">Menú Principal</button>
      </div>
    </div>
  </div>

  <div class="touch-controls">
    <button id="btnLeft">◀</button>
    <button id="btnJump">▲</button>
    <button id="btnRight">▶</button>
  </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
